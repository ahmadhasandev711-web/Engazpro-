name: Build Android APK (Engaz.PRO)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Build Web Frontend
        run: npm run build --workspace=web

      - name: Sync Capacitor Android Assets
        run: npx cap sync android
        working-directory: web

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew
        working-directory: web/android

      - name: Build Android APK via Gradle
        run: ./gradlew assembleDebug
        working-directory: web/android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: EngazPro-Mobile-App
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
